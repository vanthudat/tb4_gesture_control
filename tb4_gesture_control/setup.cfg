# Quy định nơi setuptools đặt các executable đã đăng ký trong setup.py.
# ROS 2 tìm lệnh của package tại lib/tb4_gesture_control, không phải thư mục bin chung.
[develop]
# Chế độ phát triển, thường dùng với colcon build --symlink-install.
script_dir=$base/lib/tb4_gesture_control
[install]
# Chế độ cài đặt thông thường cũng phải dùng cùng vị trí để ros2 run tìm được.
install_scripts=$base/lib/tb4_gesture_control
